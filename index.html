<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del evento en Las Carretas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Mapa a pantalla completa; panel de monte oscuro a la izquierda (abajo en celular); acento ocre de las paredes de la casona */
  --forest:#16302a;
  --forest-2:#21423a;
  --paper:#f3eee2;
  --mist:#a7bcb0;
  --ochre:#e2b445;
  --brick:#a8452f;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --panel-w:340px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#cfdfe4;color:var(--paper);font:15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.place{position:absolute;left:0;top:0;white-space:nowrap;font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:#1d2b22;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px rgba(255,255,255,.8);transform-origin:50% 50%}
.place.big{color:#5a1d12}
.place.road{color:#3b3b38}
.place.water{color:#24485a}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:0;background:#fffdf7;color:#1c241f;font:600 13px/1.1 var(--body);box-shadow:0 2px 8px rgba(20,30,25,.28);cursor:pointer;white-space:nowrap;transition:box-shadow .15s}
.pin b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/1 var(--display)}
.pin::after{content:"";position:absolute;left:14px;bottom:-5px;width:9px;height:9px;background:#fffdf7;transform:rotate(45deg);z-index:-1}
.pin.on{box-shadow:0 0 0 3px var(--c),0 4px 14px rgba(20,30,25,.35)}
.pin:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.edit .pin{cursor:grab}
.edit .pin.drag{cursor:grabbing}

#panel{position:fixed;left:16px;top:16px;bottom:16px;width:var(--panel-w);display:flex;flex-direction:column;background:rgba(22,48,42,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 10px 40px rgba(10,25,20,.35);overflow:hidden;z-index:5}
#panel header{padding:20px 22px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
@media (min-width:721px){#panel header{flex-direction:column}.hbtns{flex-direction:row}}
.eitem .bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.sw button{width:20px;height:20px}
.placing #scene canvas{cursor:crosshair}
#placebar{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:6;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 16px;border-radius:999px;background:var(--forest);color:var(--paper);font:600 14px/1.2 var(--body);box-shadow:0 6px 20px rgba(10,25,20,.35);white-space:nowrap}
#placebar[hidden]{display:none}
.eitem.on{outline:2px solid var(--ochre)}
.zone{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;padding:5px 11px;border-radius:7px;border:0;background:var(--c);color:#fff;font:700 12px/1.1 var(--body);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 10px rgba(20,30,25,.3);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px)}
.zone.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 4px 14px rgba(20,30,25,.35)}
.zone:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.vh{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--c);pointer-events:auto;cursor:grab;box-shadow:0 1px 5px rgba(0,0,0,.4);touch-action:none;padding:0}
.vh.mid{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--c);border:2px solid #fff;opacity:.9}
.vh.first{width:22px;height:22px;margin:-11px 0 0 -11px}
.sec{margin:16px 6px 8px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.sec:first-child{margin-top:4px}
.sq{display:inline-block;width:26px;height:26px;border-radius:7px;background:var(--c);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 4px,transparent 4px 8px);flex:none}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.item .inc{display:block;color:var(--mist);font-size:12.5px;margin-top:3px}
.ahint{margin:0;color:var(--mist);font-size:12.5px}
#placebar .pbb{display:flex;gap:6px}
.mini{display:flex;gap:4px;align-items:center}
.btn.icon{padding:6px 8px;min-width:30px}
.btn.danger{color:#ffb4a3}
.eyebrow{margin:0 0 6px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
h1{margin:0;font:700 26px/1.08 var(--display);text-wrap:balance}
.sub{margin:8px 0 0;color:var(--mist);font-size:14px}
#scroll{flex:1;overflow:auto;padding:10px 12px 12px}
#list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
.item:hover,.item.on{background:var(--forest-2)}
.item:focus-visible{outline:2px solid var(--ochre)}
.num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:700 13px/1 var(--display)}
.item strong{display:block;font:600 15px/1.25 var(--body)}
.item span.d{display:block;color:var(--mist);font-size:13.5px;margin-top:2px}
.btn.toggle{display:none}
.foot{margin:0;padding:12px 22px 16px;border-top:1px solid rgba(255,255,255,.08);color:var(--mist);font-size:12px}

/* edición */
.note{margin:4px 4px 12px;padding:10px 12px;border-radius:10px;background:rgba(226,180,69,.13);color:#f0dca8;font-size:13px}
.field{display:grid;gap:4px;margin:0 4px 10px}
.field label{font-size:12px;color:var(--mist)}
input[type=text],textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#0f2520;color:var(--paper);font:inherit;font-size:14px}
textarea{resize:vertical;min-height:52px}
input:focus,textarea:focus{outline:2px solid var(--ochre);outline-offset:0;border-color:transparent}
.eitem{padding:10px;border-radius:10px;background:var(--forest-2);display:grid;gap:8px}
.eitem .row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center}
.sw{display:flex;gap:5px;flex-wrap:nowrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--paper);font:600 14px/1 var(--body);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.primary{background:var(--ochre);border-color:var(--ochre);color:#1f1a0c}
.btn.primary:hover{background:#ecc25c}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--mist)}
.btn:focus-visible,.sw button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tools{display:grid;gap:8px;padding:12px 4px 4px}
.status{margin:0;font-size:12.5px;color:var(--mist);min-height:1.2em}

#hud{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:4}
#daynight{display:flex;align-items:center;gap:7px;height:46px;padding:0 16px 0 13px;border-radius:999px;background:rgba(255,253,247,.94);box-shadow:0 2px 10px rgba(20,30,25,.25);border:0;cursor:pointer;font:700 14px/1 var(--body);color:#26322b}
#compass{width:46px;height:46px;border-radius:50%;background:rgba(255,253,247,.94);box-shadow:0 2px 10px rgba(20,30,25,.25);display:grid;place-items:center;border:0;cursor:pointer;padding:0}
#compass svg{width:34px;height:34px;transition:transform .05s linear}
.views{display:flex;background:rgba(255,253,247,.94);border-radius:10px;box-shadow:0 2px 10px rgba(20,30,25,.25);overflow:hidden}
.views button{border:0;background:transparent;padding:9px 13px;font:600 13px/1 var(--body);color:#26322b;cursor:pointer}
.views button[aria-pressed=true]{background:var(--forest);color:var(--paper)}
.views button:focus-visible{outline:2px solid var(--ochre);outline-offset:-2px}
#hint{position:fixed;right:16px;bottom:16px;padding:7px 11px;border-radius:8px;background:rgba(255,253,247,.9);color:#3a463f;font-size:12.5px;box-shadow:0 2px 8px rgba(20,30,25,.18);z-index:4}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#24352d;font:600 15px var(--body);pointer-events:none}

#selcard{display:none}
button,.pin,.zone{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:720px){
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:58%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  #panel.closed{height:auto}
  #panel.closed #scroll,#panel .foot{display:none}
  #panel header{padding:12px 16px 10px;flex-direction:row;align-items:center}
  #panel header .eyebrow{display:none}
  .sub{display:none}
  h1{font-size:19px}
  .btn.toggle{display:inline-flex;padding:10px 14px;font-size:14px}
  #placebar{top:auto;bottom:calc(58% + 12px);font-size:13px;max-width:calc(100% - 24px);white-space:normal}
  #hint{display:none}
  #hud{right:10px;top:10px;flex-direction:row-reverse;align-items:center;gap:8px}
  #compass{width:40px;height:40px}
  #daynight{height:40px;padding:0 12px 0 10px;font-size:13px}
  .views button{padding:10px 12px}
  #panel.closed #selcard:not([hidden]){display:grid}
  #selcard{grid-template-columns:30px 1fr auto;gap:10px;align-items:start;margin:0 12px 12px;padding:12px;border-radius:12px;background:var(--forest-2)}
  #selcard strong{display:block;font:600 16px/1.25 var(--body)}
  #selcard .d{display:block;color:var(--mist);font-size:14px;margin-top:2px}
  #selcard .x{border:0;background:transparent;color:var(--mist);font:600 22px/1 var(--body);padding:0 4px;cursor:pointer}
  .item{padding:12px 10px}
  .place{font-size:9.5px;letter-spacing:.07em}
  .zone{font-size:10px;padding:4px 8px}
  .pin{font-size:12.5px}
  .compact .pin{padding:3px}
  .compact .pin span{display:none}
  .compact .pin.on{padding:3px 10px 3px 3px}
  .compact .pin.on span{display:inline}
  .compact .place.minor{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#daynight svg{width:20px;height:20px;color:#26322b;flex:none}
#daynight .sun{display:none}
/* ===== Modo noche: el predio de noche, guirnaldas y neón ===== */
body.night{--forest:#140d2b;--forest-2:#24184a;--paper:#f4efff;--mist:#a99fd0;--ochre:#ff4fb3;color-scheme:dark;background:#070b1a}
body.night #daynight .moon{display:none}
body.night #daynight .sun{display:block;color:#ffd35a}
body.night #daynight{color:#f4efff}
body.night #panel{background:rgba(16,10,38,.84);border:1px solid rgba(255,79,179,.35);box-shadow:0 0 0 1px rgba(45,226,230,.12),0 0 40px rgba(255,79,179,.18),0 18px 50px rgba(0,0,0,.6)}
body.night h1{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,#ff4fb3,#ffd35a 55%,#2de2e6);-webkit-background-clip:text;background-clip:text;color:transparent}
body.night .eyebrow,body.night .sec{color:#2de2e6;text-shadow:0 0 8px rgba(45,226,230,.6)}
body.night .item:hover,body.night .item.on{background:rgba(255,79,179,.12)}
body.night .num{box-shadow:0 0 10px var(--c),0 0 2px #fff inset}
body.night .sq{box-shadow:0 0 10px var(--c)}
body.night .btn{border-color:rgba(255,255,255,.22)}
body.night .place{color:#d9e4ff;text-shadow:0 0 6px rgba(120,150,255,.9),0 0 14px rgba(60,80,200,.7);font-weight:700}
body.night .place.big{color:#ffd35a;text-shadow:0 0 8px rgba(255,190,60,.9),0 0 18px rgba(255,140,0,.6)}
body.night .place.water{color:#7ff3ff;text-shadow:0 0 8px rgba(45,226,230,.9)}
body.night .place.road{color:#c9c6e0}
body.night .pin{background:#140d2b;color:#fff;border:1.5px solid var(--c);box-shadow:0 0 12px var(--c)}
body.night .pin::after{background:#140d2b;border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c)}
body.night .pin b{box-shadow:0 0 8px var(--c)}
body.night .pin.on{box-shadow:0 0 0 3px var(--c),0 0 22px var(--c)}
body.night .zone{background:rgba(10,6,28,.72);background-image:none;color:#fff;border:1.5px solid var(--c);box-shadow:0 0 12px var(--c);text-shadow:0 0 8px var(--c);font-family:"Unbounded",system-ui,sans-serif;font-weight:700}
body.night .views,body.night #compass,body.night #daynight{background:rgba(16,10,38,.86);border:1px solid rgba(255,255,255,.18)}
body.night .views button{color:#e8e2ff}
body.night .views button[aria-pressed=true]{background:linear-gradient(90deg,#ff4fb3,#a34dff);color:#fff}
body.night #compass svg path:last-child{fill:#5b5680}
body.night #hint,body.night #loading{background:rgba(16,10,38,.86);color:#cfc8ef;border:1px solid rgba(255,255,255,.15)}
body.night #loading{background:transparent;border:0}
body.night input[type=text],body.night textarea{background:#0b0720}
</style>

<script id="app">
(function(){
"use strict";
var STATE = JSON.parse(document.getElementById("state").textContent);
var EDIT = false; /* versión pública: solo lectura */
var PAGE_TITLE = "Mapa del evento en Las Carretas";
var THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
var ORBIT_URL = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js";
var FONT_URL = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=Unbounded:wght@700;800&display=swap";
var PALETTE = ["#d9482b","#e2b445","#2f7fbf","#7b4fb5","#2f9e6b","#e07a1f","#c2357a","#3b4a54"];
var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- shell ---------- */
document.body.insertAdjacentHTML("afterbegin",
 '<div id="scene"></div><div id="labels"></div><div id="loading">Cargando el mapa…</div>'+
 '<aside id="panel" aria-label="Atracciones del evento">'+
 ' <header><div><p class="eyebrow">Mapa del evento</p><h1 id="ev-title"></h1><p class="sub" id="ev-sub"></p></div>'+
 ' <div class="hbtns"><button class="btn small" type="button" id="edit-btn" hidden>Editar mapa</button><button class="btn small toggle" type="button" id="toggle" aria-expanded="true">Ocultar</button></div></header>'+
 ' <div id="selcard" hidden role="status" aria-live="polite"></div>'+
 ' <div id="scroll"></div>'+

      if (!del.dataset.armed){ del.dataset.armed="1"; del.textContent="¿Borrar?"; del.classList.add("danger"); setTimeout(function(){ if(del.isConnected){ delete del.dataset.armed; del.textContent="Borrar"; del.classList.remove("danger"); } },3000); return; }
      STATE.areas=STATE.areas.filter(function(q){ return q!==a; }); if (selectedArea===a.id) selectedArea=null; syncAreas(); rebuildHandles(); renderList(); areaEdited(); });
    aul.appendChild(li);
  });
  sc.appendChild(aul);
  var addA=document.createElement("div"); addA.className="tools"; addA.innerHTML='<button class="btn" type="button" id="add-area">+ Nueva área</button>'; sc.appendChild(addA);
  $("add-area").addEventListener("click", function(){ if (drawing) cancelDrawing(); else startDrawing(null); });
  var ph=document.createElement("p"); ph.className="sec"; ph.textContent="Atracciones"; sc.appendChild(ph);
  var ol=document.createElement("ol"); ol.id="list";
  STATE.pins.forEach(function(p,i){
    var li=document.createElement("li"); li.className="eitem"; li.dataset.id=p.id;
    li.className="eitem"+(selected===p.id?" on":"");
    li.innerHTML='<div class="row"><span class="num" style="--c:'+esc(p.color)+'">'+(i+1)+'</span><input type="text" id="n-'+esc(p.id)+'" aria-label="Nombre de la atracción '+(i+1)+'"><button class="btn small ghost" type="button" data-act="del" aria-label="Borrar '+esc(p.name)+'">Borrar</button></div>'+
     '<textarea id="d-'+esc(p.id)+'" aria-label="Descripción" placeholder="Descripción breve (opcional)"></textarea>'+
     '<div class="bottom"><div class="sw" role="group" aria-label="Color">'+PALETTE.map(function(c){ return '<button type="button" style="--c:'+c+'" data-c="'+c+'" aria-label="Color '+c+'" aria-pressed="'+(c===p.color)+'"></button>'; }).join("")+'</div><div class="mini"><button class="btn small icon" type="button" data-act="up" aria-label="Subir en la lista"'+(i===0?' disabled':'')+'>↑</button><button class="btn small icon" type="button" data-act="down" aria-label="Bajar en la lista"'+(i===STATE.pins.length-1?' disabled':'')+'>↓</button><button class="btn small" type="button" data-act="go">Ver</button></div></div>';
    li.querySelector("input").value=p.name||""; li.querySelector("textarea").value=p.desc||"";
    li.querySelector("input").addEventListener("input", function(e){ p.name=e.target.value; syncPins(); dirty(); });
    li.querySelector("textarea").addEventListener("input", function(e){ p.desc=e.target.value; dirty(); });
    li.querySelectorAll(".sw button").forEach(function(b){ b.addEventListener("click", function(){ p.color=b.dataset.c; syncPins(); renderList(); dirty(); }); });
    var del=li.querySelector('[data-act="del"]');
    del.addEventListener("click", function(){
      if (!del.dataset.armed){ del.dataset.armed="1"; del.textContent="¿Borrar?"; del.classList.add("danger"); setTimeout(function(){ if(del.isConnected){ delete del.dataset.armed; del.textContent="Borrar"; del.classList.remove("danger"); } },3000); return; }
      STATE.pins=STATE.pins.filter(function(q){return q!==p;}); if (selected===p.id) selected=null; syncPins(); renderList(); dirty(); });
    li.querySelector('[data-act="up"]').addEventListener("click", function(){ move(p,-1); });
    li.querySelector('[data-act="down"]').addEventListener("click", function(){ move(p,1); });
    li.querySelector("input").addEventListener("focus", function(){ select(p.id,false); });
    li.querySelector('[data-act="go"]').addEventListener("click", function(){ select(p.id,true); });
    ol.appendChild(li);
  });
  sc.appendChild(ol);
  var tools=document.createElement("div"); tools.className="tools";
  tools.innerHTML='<button class="btn" type="button" id="add">+ Agregar atracción</button>'+
   '<button class="btn primary" type="button" id="save">Guardar para los invitados</button>'+
   '<button class="btn small ghost" type="button" id="copy">Copiar datos (respaldo)</button>'+
   '<p class="status" id="status" role="status"></p>';
  sc.appendChild(tools); sc.scrollTop=keepTop;
  $("add").addEventListener("click", addPin);
  $("save").addEventListener("click", save);
  $("copy").addEventListener("click", copyData);
  setStatus(isDirty?"Hay cambios sin guardar.":"Editando. Los invitados ven la última versión guardada.");
}
var isDirty=false;
function cleanKeys(k,v){ return (typeof k==="string" && k.slice(0,2)==="__") ? undefined : v; }
/* borrador local: cada cambio queda en este navegador hasta que se guarda */
var DRAFT_KEY="lascarretas-mapa-borrador", draftT=null;
function saveDraft(){ clearTimeout(draftT); draftT=setTimeout(function(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({t:Date.now(), state:STATE}, cleanKeys)); }catch(_){} }, 250); }
function clearDraft(){ clearTimeout(draftT); try{ localStorage.removeItem(DRAFT_KEY); }catch(_){} }
function readDraft(){ try{ var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); return d && d.state ? d : null; }catch(_){ return null; } }
function dirty(){ isDirty=true; STATE.examples=false; setStatus("Hay cambios sin guardar."); saveDraft(); }
function setStatus(t){ var s=$("status"); if (s) s.textContent=t; }
function move(p, d){ var i=STATE.pins.indexOf(p), j=i+d; if (j<0||j>=STATE.pins.length) return; STATE.pins.splice(i,1); STATE.pins.splice(j,0,p); syncPins(); renderList(); dirty(); }
var placing=false;
function bar(text, buttons){
  var pb=$("placebar"); if (!text){ pb.hidden=true; return; }
  pb.hidden=false; $("pb-text").textContent=text; var bb=$("pb-btns"); bb.innerHTML="";
  (buttons||[]).forEach(function(b){ var el=document.createElement("button"); el.type="button"; el.className="btn small"+(b.p?" primary":""); el.textContent=b.t; if (b.dis) el.disabled=true; el.addEventListener("click", b.f); bb.appendChild(el); });
}
function setPlacing(on){
  placing=on; document.body.classList.toggle("placing",on||!!drawing);
  if (on) bar("Tocá el mapa donde va la nueva atracción", [{t:"Cancelar", p:1, f:function(){ setPlacing(false); setStatus(""); }}]); else if (!drawing) bar(null);
  var a=$("add"); if (a) a.textContent = on ? "Cancelar" : "+ Agregar atracción";
  if (on) setStatus("Tocá el mapa en el lugar de la nueva atracción.");
}
function addPin(){ setPlacing(!placing); }
function placeAt(x,z){
  var id="p"+Date.now().toString(36);
  var p={id:id, name:"Nueva atracción", desc:"", color:PALETTE[STATE.pins.length%PALETTE.length], x:Math.round(x*2)/2, z:Math.round(z*2)/2};
  STATE.pins.push(p); selected=id; setPlacing(false); syncPins(); renderList(); dirty();
  var inp=$("n-"+id); if (inp){ inp.scrollIntoView({block:"nearest"}); inp.focus(); inp.select(); }
  setStatus("Listo. Escribí el nombre; si hace falta, arrastrá el globo para ajustarlo.");
}
/* modo edición dentro de la página */
var SAVED = JSON.stringify(STATE, cleanKeys), exitArmed=false;
function setEdit(on){
  EDIT=on; document.body.classList.toggle("edit",on); if (drawing) cancelDrawing(); setPlacing(false); exitArmed=false; if (!on) selectedArea=null; syncAreas(); rebuildHandles();
  var b=$("edit-btn"); b.hidden = !(on||CAN_EDIT); b.textContent = on ? "Salir de edición" : "Editar mapa";
  if (on && $("panel").classList.contains("closed")) $("toggle").click();
  $("scroll").scrollTop=0;
  renderList(); resize();
}
var CAN_EDIT=false;
$("edit-btn").addEventListener("click", function(){
  if (!EDIT){ setEdit(true); return; }
  if (isDirty && !exitArmed){ exitArmed=true; setStatus("Tenés cambios sin guardar. Tocá «Salir de edición» otra vez para descartarlos, o guardá primero."); return; }
  if (isDirty){ STATE=JSON.parse(SAVED); isDirty=false; selected=null; selectedArea=null; clearDraft(); renderHeader(); syncPins(); syncAreas(); }
  setEdit(false);
});
function detectOwner(tries){
  if (!(window.claude && typeof window.claude.use==="function")){ if ((tries||0)<20) setTimeout(function(){ detectOwner((tries||0)+1); },500); return; }
  window.claude.use("user").then(function(u){
    if (!u) return;
    var f = u.isOwner ? u.isOwner() : false, g = u.canEdit ? u.canEdit() : false;
    return Promise.all([f,g]).then(function(r){ if (r[0]||r[1]){ CAN_EDIT=true; $("edit-btn").hidden=false; } });
  }).catch(function(){});
}
function buildDoc(){
  var css=document.getElementById("css").textContent, app=document.getElementById("app").textContent;
  var json=JSON.stringify(STATE,cleanKeys,1).replace(/</g,"\\u003c");
  var S="<"+"script", E="<"+"/script>";
  return "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>"+PAGE_TITLE+"</title>\n"+
   "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\""+FONT_URL+"\" rel=\"stylesheet\">\n"+
   "<style id=\"css\">"+css+"</style>\n"+S+" src=\""+THREE_URL+"\">"+E+"\n"+S+" src=\""+ORBIT_URL+"\">"+E+"\n</head>\n<body>\n"+
   S+" id=\"state\" type=\"application/json\">"+json+E+"\n"+S+" id=\"app\">"+app+E+"\n</body>\n</html>\n";
}
var artifactP=null;
function getArtifact(){
  if (!artifactP){ artifactP = (window.claude && typeof window.claude.use==="function") ? window.claude.use("artifact").catch(function(){return null;}) : Promise.resolve(null); }
  return artifactP;
}
function save(){
  setStatus("Guardando…");
  getArtifact().then(function(a){
    if (!a){ setStatus("Desde acá no se puede guardar. Abrí el mapa en claude.ai (con #editar al final del link) o usá «Copiar datos»."); artifactP=null; return; }
    return a.publish(buildDoc()).then(function(){ isDirty=false; SAVED=JSON.stringify(STATE,cleanKeys); clearDraft(); setStatus("Guardado. Los invitados ya ven esta versión."); }, function(err){
      var code=(err&&(err.code||err.name||err.message))||"";
      if (/conflict/i.test(code)){ saveDraft(); setStatus("Había una versión más nueva del mapa y la página se va a recargar. Tus cambios quedan a salvo: al recargar te ofrezco recuperarlos."); }
      else if (/not_writer|not_granted/i.test(code)) setStatus("Solo el organizador puede guardar cambios.");
      else setStatus("No se pudo guardar ("+code+"). Probá de nuevo o usá «Copiar datos».");
    });
  });
}
function copyData(){
  var txt=JSON.stringify(STATE,cleanKeys,1);
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ setStatus("Datos copiados. Pegalos en el chat si querés que los fije en el mapa."); }, function(){ setStatus("El navegador no dejó copiar."); }); }
  else setStatus("El navegador no dejó copiar.");
}

/* ---------- selección y cámara ---------- */
function select(id, fly){
  selected=id; syncPins();
  document.querySelectorAll(".item").forEach(function(b){ b.classList.toggle("on", b.dataset.id===id); });
  document.querySelectorAll(".eitem").forEach(function(b){ var on=b.dataset.id===id; b.classList.toggle("on",on); if (on && EDIT && !b.contains(document.activeElement)) b.scrollIntoView({block:"nearest", behavior: REDUCED?"auto":"smooth"}); });
  var p=STATE.pins.filter(function(q){return q.id===id;})[0];
  if (p && MOBILE && !EDIT){ setSheet(false); showCard(cardForPin(p)); }
  if (p && fly){ var dir=camera.position.clone().sub(controls.target); var dist=Math.min(dir.length(), MOBILE?120:95); dir.setLength(Math.max(dist,MOBILE?115:60)); flyTo(new THREE.Vector3(p.x,0,p.z), new THREE.Vector3(p.x,0,p.z).add(dir)); }
}
var anim=null;
function flyTo(target, pos, ms){
  ms = REDUCED ? 0 : (ms||900);
  anim={t0:performance.now(), ms:ms, ft:controls.target.clone(), fp:camera.position.clone(), tt:target, tp:pos};
}
function view(kind){
  document.querySelectorAll(".views button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.view===kind)); });
  var v = kind==="top" ? TOP : HOME;
  controls.minPolarAngle=0; flyTo(new THREE.Vector3(v.t[0],v.t[1],v.t[2]), new THREE.Vector3(v.p[0],v.p[1],v.p[2]));
}
document.querySelectorAll(".views button").forEach(function(b){ b.addEventListener("click", function(){ view(b.dataset.view); }); });
$("compass").addEventListener("click", function(){ var t=controls.target, d=camera.position.clone().sub(t); var hz=Math.hypot(d.x,d.z); flyTo(t.clone(), new THREE.Vector3(t.x, camera.position.y, t.z+hz)); });
function setSheet(open){
  var pn=$("panel"); pn.classList.toggle("closed", !open);
  var t=$("toggle"); t.textContent = open ? "Ocultar" : (MOBILE ? "Ver atracciones" : "Ver lista"); t.setAttribute("aria-expanded", String(open)); resize();
}
$("toggle").addEventListener("click", function(){ setSheet($("panel").classList.contains("closed")); });
function showCard(html){
  var c=$("selcard"); if (!html){ c.hidden=true; c.innerHTML=""; resize(); return; }
  c.innerHTML=html+'<button class="x" type="button" aria-label="Cerrar">×</button>'; c.hidden=false;
  c.querySelector(".x").addEventListener("click", function(){ selected=null; selectedArea=null; syncPins(); syncAreas(); showCard(null); });
  resize();
}
function cardForPin(p){
  var i=STATE.pins.indexOf(p), inArea=STATE.areas.filter(function(a){ return a.points.length>=3 && inPoly(p.x,p.z,a.points); })[0];
  return '<span class="num" style="--c:'+esc(p.color)+'">'+(i+1)+'</span><span><strong>'+esc(p.name||"Sin nombre")+'</strong>'+(p.desc?'<span class="d">'+esc(p.desc)+'</span>':'')+(inArea?'<span class="d">'+esc(inArea.name)+'</span>':'')+'</span>';
}
function cardForArea(a){
  var inc=pinsIn(a).map(function(p){ return p.name; }).filter(Boolean);
  return '<span class="sq" style="--c:'+esc(a.color)+'"></span><span><strong>'+esc(a.name||"Área")+'</strong>'+(inc.length?'<span class="d">'+esc(inc.join(" · "))+'</span>':'')+'</span>';
}

/* colocar un globo tocando el mapa */
var downXY=null;
renderer.domElement.addEventListener("pointerdown", function(e){ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener("pointerup", function(e){
  if ((!placing && !drawing) || !downXY) return;
  if (Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]) > 6) return;
  var r=renderer.domElement.getBoundingClientRect();
  var m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m, camera);
  if (ray.ray.intersectPlane(plane, hit)){ if (drawing) addDrawPoint(hit.x, hit.z); else placeAt(hit.x, hit.z); }
});
addEventListener("keydown", function(e){ if (e.key!=="Escape") return; if (drawing) cancelDrawing(); else if (placing){ setPlacing(false); setStatus(""); } });

/* ---------- arrastre de globos (modo edición) ---------- */
var dragging=null, dragMoved=false, ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();
function onPinDown(e,p){
  dragMoved=false;
  if (!EDIT) return;
  dragging=p; controls.enabled=false; pinObjs[p.id].el.classList.add("drag"); e.preventDefault();
  try{ pinObjs[p.id].el.setPointerCapture(e.pointerId); }catch(_){}
}
addEventListener("pointermove", function(e){
  if (dragV){
    var r0=renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((e.clientX-r0.left)/r0.width)*2-1, -((e.clientY-r0.top)/r0.height)*2+1), camera);
    if (ray.ray.intersectPlane(plane, hit)){
      var pt=[Math.round(hit.x*2)/2, Math.round(hit.z*2)/2];
      if (dragV.mid){ dragV.a.points.splice(dragV.idx+1,0,pt); dragV.idx+=1; dragV.mid=false; dragV.el.classList.remove("mid"); }
      else dragV.a.points[dragV.idx]=pt;
      dragMoved=true; syncAreas();
    }
    return;
  }
  if (!dragging) return;
  var r=renderer.domElement.getBoundingClientRect();
  var m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m, camera);
  if (ray.ray.intersectPlane(plane, hit)){ dragging.x=Math.round(hit.x*2)/2; dragging.z=Math.round(hit.z*2)/2; dragMoved=true; syncPins(); }
});
addEventListener("pointerup", function(){
  if (dragV){ dragV=null; controls.enabled=true; if (dragMoved){ areaEdited(); rebuildHandles(); } return; }
  if (!dragging) return;
  var p=dragging; pinObjs[p.id] && pinObjs[p.id].el.classList.remove("drag");
  dragging=null; controls.enabled=true;
  if (dragMoved){ dirty(); select(p.id,false); setTimeout(function(){ dragMoved=false; },0); }
});

/* ---------- loop ---------- */
var panelOffset={x:0,y:0};
function resize(){
  W=innerWidth; H=innerHeight; renderer.setSize(W,H); camera.aspect=W/H;
  var pn=$("panel").getBoundingClientRect();
  if (W>720){ panelOffset={x:-(pn.width+16)/2, y:0}; } else { panelOffset={x:0, y:Math.round(pn.height/2)}; }
  camera.setViewOffset(W,H,panelOffset.x,panelOffset.y,W,H);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
var tmp=new THREE.Vector3(), tmp2=new THREE.Vector3(), compactOn=false;
function project(v, el){
  tmp.copy(v).project(camera);
  if (tmp.z>1 || tmp.z<-1){ el.style.visibility="hidden"; return; }
  var x=(tmp.x+1)/2*W, y=(1-tmp.y)/2*H;
  el.style.visibility="visible"; return [x,y];
}
var compassSvg=$("compass").querySelector("svg"), frameN=0, tmp3=new THREE.Vector3();
function placeAreaLabels(pinScr){
  /* elige, entre los puntos candidatos del área, el que en pantalla queda más lejos de los globos */
  STATE.areas.forEach(function(a){
    var o=areaObjs[a.id]; if (!o || !a.__cands || o.el.hidden) return;
    var hw=(o.el.offsetWidth||110)/2, best=null, bs=-1e9, cur=-1e9;
    a.__cands.forEach(function(c, i){
      tmp3.set(c[0],1.2,c[1]).project(camera); if (tmp3.z>1||tmp3.z<-1) return;
      var x=(tmp3.x+1)/2*W, y=(1-tmp3.y)/2*H, dmin=1e9;
      pinScr.forEach(function(q){ var dx=Math.max(0,Math.abs(x-q[0])-hw-q[2]), dy=Math.max(0,Math.abs(y-q[1])-26); dmin=Math.min(dmin, Math.hypot(dx,dy)); });
      var sc=Math.min(dmin,60)*2 + c[2];
      if (o.v.x===c[0] && o.v.z===c[1]) cur=sc;
      if (sc>bs){ bs=sc; best=c; }
    });
    if (best && bs>cur+6) o.v.set(best[0],1.2,best[1]);
  });
}
function frame(now){
  requestAnimationFrame(frame);
  if (anim){
    var k = anim.ms ? Math.min(1,(now-anim.t0)/anim.ms) : 1; var e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(anim.ft, anim.tt, e); camera.position.lerpVectors(anim.fp, anim.tp, e);
    if (k>=1){ anim=null; if (document.querySelector('.views button[data-view="3d"]').getAttribute("aria-pressed")==="true") controls.minPolarAngle=0; }
  }
  for (var pk in propObjs){ var po=propObjs[pk]; if (po.g.userData.anim) po.g.userData.anim(now); }
  controls.update();
  /* no dejar que el mapa se vaya del predio al arrastrar */
  var tx=Math.max(-110,Math.min(150,controls.target.x)), tz=Math.max(-170,Math.min(130,controls.target.z));
  if (tx!==controls.target.x || tz!==controls.target.z){ camera.position.x+=tx-controls.target.x; camera.position.z+=tz-controls.target.z; controls.target.x=tx; controls.target.z=tz; }
  var cmp = W<=720 && camera.position.distanceTo(controls.target)>150;
  if (cmp!==compactOn){ compactOn=cmp; document.body.classList.toggle("compact", cmp); }
  places.forEach(function(pl){ var s=project(pl.v, pl.el); if (s) pl.el.style.transform="translate("+s[0].toFixed(1)+"px,"+s[1].toFixed(1)+"px) translate(-50%,-50%)"; });
  var pinScr=[];
  STATE.pins.forEach(function(p){ var o=pinObjs[p.id]; if(!o) return; o.v.set(p.x,12.2,p.z); var s=project(o.v,o.el); if (s){ o.el.style.transform="translate("+s[0].toFixed(1)+"px,"+s[1].toFixed(1)+"px) translate(-14px,-100%)"; o.el.style.zIndex=String(1000-Math.round(tmp.z*1000)); pinScr.push([s[0]+(o.el.offsetWidth||90)/2-14, s[1]-14, (o.el.offsetWidth||90)/2]); } });
  if ((frameN++ % 10)===0) placeAreaLabels(pinScr);
  STATE.areas.forEach(function(a){ var o=areaObjs[a.id]; if (!o || o.el.hidden) return; var s=project(o.v,o.el); if (s) o.el.style.transform="translate("+s[0].toFixed(1)+"px,"+s[1].toFixed(1)+"px) translate(-50%,-50%)"; });
  handles.forEach(function(h){ var q=handlePos(h); if (!q) return; tmp2.set(q[0],.3,q[1]); var s=project(tmp2,h.el); if (s) h.el.style.transform="translate("+s[0].toFixed(1)+"px,"+s[1].toFixed(1)+"px)"; });
  compassSvg.style.transform="rotate("+controls.getAzimuthalAngle()+"rad)";
  renderer.render(scene,camera);
}
renderHeader(); syncPins(); syncAreas(); setEdit(false);
if (MOBILE && !EDIT) setSheet(false);
(function offerRecovery(){ return;
  var d=readDraft(); if (!d) return;
  if (JSON.stringify(d.state, cleanKeys)===SAVED){ clearDraft(); return; }
  var when=new Date(d.t), hh=("0"+when.getHours()).slice(-2)+":"+("0"+when.getMinutes()).slice(-2);
  bar("Tenés cambios sin guardar de las "+hh+".", [
    {t:"Recuperar", p:1, f:function(){ STATE=d.state; if (!STATE.areas) STATE.areas=[]; selected=null; selectedArea=null; renderHeader(); syncPins(); syncAreas(); bar(null); setEdit(true); isDirty=true; setStatus("Recuperé tus cambios. Tocá «Guardar para los invitados» para que queden."); }},
    {t:"Descartar", f:function(){ clearDraft(); bar(null); }}
  ]);
})();
$("loading").remove();
requestAnimationFrame(frame);
window.__ready = true;
})();
</script>
